<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Energy Usage</title>

    <style>
        body {

            font-family: Arial;
            background: #f0f5f0;
            padding: 40px;

        }

        .container {

            width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;

        }

        table {

            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;

        }

        table,
        th,
        td {

            border: 1px solid gray;

        }

        th,
        td {

            padding: 12px;
            text-align: center;

        }

        a {

            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: black;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;

        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Energy Usage</h2>

        <table>

            <tr>

                <th>Device</th>
                <th>Power</th>
                <th>Status</th>

            </tr>

            <tr>

                <td>Light</td>
                <td>20 W</td>
                <td>ON</td>

            </tr>

            <tr>

                <td>Fan</td>
                <td>70 W</td>
                <td>OFF</td>

            </tr>

            <tr>

                <td>Air Conditioner</td>
                <td>1500 W</td>
                <td>ON</td>

            </tr>

            <tr>

                <td>Refrigerator</td>
                <td>200 W</td>
                <td>ON</td>

            </tr>

        </table>

        <h3>Total Consumption : 1790 W</h3>

        <a href="/dashboard">Back</a>

    </div>

</body>

</html>
