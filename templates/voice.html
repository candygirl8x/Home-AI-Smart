<!DOCTYPE html>
<html>

<head>

    <title>Voice Control</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 40px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        button {

            padding: 15px 35px;
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;

        }

        .response {

            margin-top: 30px;
            padding: 20px;
            background: #f4f4f4;
            border-radius: 10px;

        }

        a {

            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: black;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🎤 Voice Control</h1>

        <p>Click the button and speak.</p>

        <form method="POST">

            <button>

                🎙 Start Listening

            </button>

        </form>

        {% if response %}

        <div class="response">

            <h3>Assistant Response</h3>

            <p>{{ response }}</p>

        </div>

        {% endif %}

        <a href="/">Back to Home</a>

    </div>

</body>

</html>
