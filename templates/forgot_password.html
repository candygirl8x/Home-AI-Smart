<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f7fc;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {

            width: 400px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);

        }

        h1 {

            text-align: center;
            color: #0d6efd;

            margin-bottom: 25px;

        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            box-sizing: border-box;

        }

        button {

            width: 100%;

            padding: 12px;

            background: #0d6efd;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

        }

        button:hover {

            background: #0b5ed7;

        }

        a {

            display: block;

            margin-top: 20px;

            text-align: center;

            text-decoration: none;

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Forgot Password</h1>

        <form method="POST">

            <input type="email" name="email" placeholder="Enter your registered email" required>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="{{ url_for('login') }}">
            Back to Login
        </a>

    </div>

</body>

</html>
