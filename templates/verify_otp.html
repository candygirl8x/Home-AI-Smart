<!DOCTYPE html>
<html>

<head>

    <title>Verify OTP</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .box {

            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;

        }

        input {

            width: 100%;
            padding: 10px;
            margin-top: 15px;

        }

        button {

            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;

        }

        .success {

            background: #d4edda;
            color: #155724;
            padding: 10px;
            margin-bottom: 15px;

        }

        .danger {

            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            margin-bottom: 15px;

        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Verify OTP</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

        {% for category, message in messages %}

        <div class="{{ category }}">
            {{ message }}
        </div>

        {% endfor %}

        {% endif %}

        {% endwith %}

        <form method="POST">

            <input type="text" name="otp" placeholder="Enter OTP" required>

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <p style="text-align:center;margin-top:20px;">

            <a href="{{ url_for('resend_otp') }}">
                Resend OTP
            </a>

        </p>

    </div>

</body>

</html>
