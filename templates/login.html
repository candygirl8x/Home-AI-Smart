<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Smart Home AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>


<body>

    <div class="box">

        <h1>Login</h1>


        <form action="{{ url_for('login') }}" method="POST">

            <label for="email"><b>Email</b></label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password"><b>Password</b></label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>
        <div class="link">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>


            <p>
                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>
            </p>

        </div>


    </div>


</body>

</html>
