<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Smart Home AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #007bff;
            font-size: 16px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .flash-success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        .flash-danger {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>My Profile</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ user.username or '' }}" placeholder="Enter your name"
                required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email or '' }}" placeholder="Enter your email"
                required>

            <button type="submit">
                Update Profile
            </button>

        </form>

        <a class="back" href="{{ url_for('dashboard') }}">
            Back to Dashboard
        </a>

    </div>

</body>

</html>
