<!DOCTYPE html>
<html>

<head>
    <title>Smart Home AI Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            display: inline-block;
            width: 200px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }
    </style>

</head>


<body>


    <h1>Smart Home AI Dashboard</h1>

    <h2>Welcome {{ username }}</h2>


    <div class="card">

        <h3>Devices</h3>

        <p>Control your smart devices</p>

        <a href="/devices">
            <button>
                View Devices
            </button>
        </a>

    </div>



    <div class="card">

        <h3>Automation</h3>

        <p>Create smart rules</p>

        <a href="/automation">
            <button>
                Manage Rules
            </button>
        </a>

    </div>



    <div class="card">

        <h3>Energy Usage</h3>

        <p>Monitor electricity usage</p>

        <a href="/energy">
            <button>
                View Energy
            </button>
        </a>
    </div>



    <br><br>

    <a href="/logout">
        <button>
            Logout
        </button>
    </a>


</body>

</html>
